[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daum-video-mcp"
version = "0.1.0"
description = "Small MCP server and reusable client for Daum video search."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "daum-video-mcp contributors" }
]
dependencies = [
  "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
server = [
  "fastmcp>=2.0.0",
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.11.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
